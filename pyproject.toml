[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-research-lab"
version = "0.1.0"
description = "Python curriculum for AI research engineering and safety research"
requires-python = ">=3.11"
dependencies = [
    "jupyterlab>=4.5.6",
    "notebook>=7.5.5",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "matplotlib>=3.10.9",
    "seaborn>=0.13",
    "scipy>=1.11",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
